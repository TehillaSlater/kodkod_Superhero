<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man: Rooftop Runner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container">
        <div id="hud">
            <div id="controlsHint">⬆️/SPACE: Jump | ⬇️: Crouch | X: Web | D: Doc Ock | G: Goblin</div>
            <div id="stats">
                <div id="webAmmo">🕸️ Webs: <span id="ammoCount">5</span>/5</div>
                <div id="scoreBoard">Score: <span id="score">0</span></div>
            </div>
        </div>

        <div id="gameBoard" class="night">
            <!-- שמש / ירח וכוכבים -->
            <div id="celestial"></div>
            <div id="stars"></div>

            <!-- קו הרקיע של ניו יורק -->
            <div id="skyline"></div>

            <!-- התראת חוש העכביש לפני מתקפות בוס -->
            <div id="spiderSense" class="hidden">⚡ SPIDER-SENSE! ⚡</div>

            <!-- שכבת SVG לקור הנדנוד שמתחבר מהיד של ספיידרמן לתקרה -->
            <svg id="webCanvas" width="880" height="360">
                <line id="swingLine" x1="0" y1="0" x2="0" y2="0" stroke="white" stroke-width="3.5"
                    stroke-dasharray="8,3" class="hidden" />
                <circle id="webAnchor" cx="0" cy="6" r="7" fill="white" class="hidden" />
            </svg>

            <!-- ספיידרמן -->
            <div id="spiderman" class="run-1"></div>

            <!-- הגובלין הירוק על הגליידר בשמיים -->
            <div id="greenGoblin"></div>

            <!-- מכשולים רצים (פצצות גובלין / כטב"מים של מיסטריו) -->
            <div id="obstacle" class="pumpkin"></div>

            <!-- הזרוע המכנית של דוק אוק שנשלחת מהקצה הימני -->
            <div id="docOckTentacle"></div>

            <!-- גגות הבניינים -->
            <div id="ground"></div>
        </div>

        <div id="gameOverScreen" class="hidden">
            <h2>WASTED!</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <p class="restart-hint">Press SPACE to swing again</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
